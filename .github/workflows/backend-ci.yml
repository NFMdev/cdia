name: backend-ci

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + tests + coverage
        run: mvn -B -Pcoverage verify -DskipITs

      - name: Coverage threshold
        env:
          MIN_LINE_COVERAGE: '0.05'
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          min_cov = float(__import__('os').environ['MIN_LINE_COVERAGE'])
          covered = 0
          missed = 0
          for path in glob.glob('**/target/site/jacoco/jacoco.xml', recursive=True):
              root = ET.parse(path).getroot()
              for c in root.findall('counter'):
                  if c.attrib.get('type') == 'LINE':
                      covered += int(c.attrib.get('covered', '0'))
                      missed += int(c.attrib.get('missed', '0'))
          total = covered + missed
          ratio = (covered / total) if total else 0.0
          print(f'Line coverage: {ratio:.4f} (min: {min_cov:.4f})')
          if ratio < min_cov:
              raise SystemExit(1)
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/*'
