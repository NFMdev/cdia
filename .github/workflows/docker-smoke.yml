name: docker-smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application jars
        run: mvn -B clean package -DskipTests -pl '!processing-service'

      - name: Build processing-service jar (Java 17 target)
        run: mvn -B clean package -DskipTests -pl processing-service -am

      - name: Start stack
        env:
          UNSAFE_DEMO_MODE: 'true'
          ELASTIC_PASSWORD: test
          POSTGRES_SUPERPASS: change_me_superpass
          CDIA_APP_DB_PASSWORD: change_me_app
          CDIA_MIGRATIONS_DB_PASSWORD: change_me_migrations
          CDIA_METRICS_DB_PASSWORD: change_me_metrics
          GRAFANA_ADMIN_PASSWORD: admin
        run: bash ./scripts/compose-up.sh

      - name: Wait for dependencies
        env:
          ELASTIC_PASSWORD: test
        run: bash ./scripts/wait-for-services.sh

      - name: Smoke HTTP checks
        run: |
          curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null
          curl -fsS http://127.0.0.1:8085/actuator/health > /dev/null
          curl -fsS http://127.0.0.1:8084/actuator/health > /dev/null
          curl -fsS http://127.0.0.1:8081/overview > /dev/null

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-smoke.log

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-logs
          path: docker-smoke.log

      - name: Teardown
        if: always()
        run: docker compose down -v
