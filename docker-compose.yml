name: cdia

networks:
  cdia-net:
    driver: bridge

volumes:
  postgres_data:
  es_data:
  flink-checkpoints:
  flink-savepoints:

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: if_not_present
    container_name: postgres
    profiles: ["core", "all"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:-change_me_superpass}
      POSTGRES_DB: ${POSTGRES_DB:-cdia}
      CDIA_APP_DB_USER: ${CDIA_APP_DB_USER:-cdia_app}
      CDIA_APP_DB_PASSWORD: ${CDIA_APP_DB_PASSWORD:-change_me_app}
      CDIA_MIGRATIONS_DB_USER: ${CDIA_MIGRATIONS_DB_USER:-cdia_migrations}
      CDIA_MIGRATIONS_DB_PASSWORD: ${CDIA_MIGRATIONS_DB_PASSWORD:-change_me_migrations}
      CDIA_METRICS_DB_USER: ${CDIA_METRICS_DB_USER:-cdia_metrics}
      CDIA_METRICS_DB_PASSWORD: ${CDIA_METRICS_DB_PASSWORD:-change_me_metrics}
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - cdia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-cdia}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  cdia-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    pull_policy: if_not_present
    container_name: cdia-elasticsearch
    profiles: ["core", "all"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-test}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      node.name: es01
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - cdia-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTIC_PASSWORD:-test} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s

  ingestion-service:
    image: eclipse-temurin:21-jre
    pull_policy: if_not_present
    container_name: ingestion-service
    profiles: ["apps", "all"]
    depends_on:
      postgres:
        condition: service_healthy
      cdia-elasticsearch:
        condition: service_healthy
      search-service:
        condition: service_started
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:8080:8080"
    working_dir: /app
    command: ["java", "-jar", "/app/ingestion-service-exec.jar"]
    volumes:
      - ./ingestion-service/target/ingestion-service-exec.jar:/app/ingestion-service-exec.jar:ro
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cdia}
      CDIA_APP_DB_USER: ${CDIA_APP_DB_USER:-cdia_app}
      CDIA_APP_DB_PASSWORD: ${CDIA_APP_DB_PASSWORD:-change_me_app}
      CDIA_MIGRATIONS_DB_USER: ${CDIA_MIGRATIONS_DB_USER:-cdia_migrations}
      CDIA_MIGRATIONS_DB_PASSWORD: ${CDIA_MIGRATIONS_DB_PASSWORD:-change_me_migrations}
      SPRING_ELASTICSEARCH_URIS: http://cdia-elasticsearch:9200
      SPRING_ELASTICSEARCH_USERNAME: elastic
      SPRING_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-test}
      CDIA_SEARCH_BASE_URL: ${CDIA_SEARCH_BASE_URL:-http://search-service:8085}
      CDIA_SEARCH_INDEXING_ENABLED: ${CDIA_SEARCH_INDEXING_ENABLED:-true}
      CDIA_SEARCH_INDEXING_MAX_ATTEMPTS: ${CDIA_SEARCH_INDEXING_MAX_ATTEMPTS:-3}
      CDIA_SEARCH_INDEXING_RETRY_BACKOFF_MS: ${CDIA_SEARCH_INDEXING_RETRY_BACKOFF_MS:-200}
    networks:
      - cdia-net

  search-service:
    image: eclipse-temurin:21-jre
    pull_policy: if_not_present
    container_name: search-service
    profiles: ["apps", "all"]
    depends_on:
      cdia-elasticsearch:
        condition: service_healthy
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:8085:8085"
    working_dir: /app
    command: ["java", "-jar", "/app/search-service-exec.jar"]
    volumes:
      - ./search-service/target/search-service-exec.jar:/app/search-service-exec.jar:ro
    environment:
      SPRING_ELASTICSEARCH_URIS: http://cdia-elasticsearch:9200
      SPRING_ELASTICSEARCH_USERNAME: elastic
      SPRING_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-test}
      CDIA_ANOMALIES_RETENTION_DAYS: ${CDIA_ANOMALIES_RETENTION_DAYS:-30}
    networks:
      - cdia-net

  reports-service:
    image: eclipse-temurin:21-jre
    pull_policy: if_not_present
    container_name: reports-service
    profiles: ["apps", "all"]
    depends_on:
      cdia-elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:8084:8084"
    working_dir: /app
    command: ["java", "-jar", "/app/reports-service-exec.jar"]
    volumes:
      - ./reports-service/target/reports-service-exec.jar:/app/reports-service-exec.jar:ro
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cdia}
      CDIA_APP_DB_USER: ${CDIA_APP_DB_USER:-cdia_app}
      CDIA_APP_DB_PASSWORD: ${CDIA_APP_DB_PASSWORD:-change_me_app}
      SPRING_ELASTICSEARCH_URIS: http://cdia-elasticsearch:9200
      SPRING_ELASTICSEARCH_USERNAME: elastic
      SPRING_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-test}
    networks:
      - cdia-net

  event-simulator-service:
    image: eclipse-temurin:21-jre
    pull_policy: if_not_present
    container_name: event-simulator-service
    profiles: ["apps", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:8082:8082"
    working_dir: /app
    command: ["java", "-jar", "/app/event-simulator-service-exec.jar"]
    volumes:
      - ./event-simulator-service/target/event-simulator-service-exec.jar:/app/event-simulator-service-exec.jar:ro
    environment:
      SIMULATOR_TARGET_URL: http://ingestion-service:8080/events
    networks:
      - cdia-net

  flink-init-perms:
    image: flink:1.20.3-scala_2.12-java17
    pull_policy: if_not_present
    container_name: flink-init-perms
    profiles: ["streaming", "all"]
    user: "0:0"
    entrypoint: ["/bin/bash","-lc"]
    command: 
      - |
        set -euxo pipefail;
        echo "== whoami =="; whoami; id;
        echo "== mounts =="; mount | grep -E 'flink-checkpoints|flink-savepoints' || true;
        echo "== ls before =="; ls -ld /flink-checkpoints /flink-savepoints || true;
        echo "== id flink =="; id flink;
        mkdir -p /flink-checkpoints /flink-savepoints;
        chown -R flink:flink /flink-checkpoints /flink-savepoints;
        echo "== ls after =="; ls -ld /flink-checkpoints /flink-savepoints;
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - flink-savepoints:/flink-savepoints
    networks:
      - cdia-net

  flink-jobmanager:
    image: flink:1.20.3-scala_2.12-java17
    restart: unless-stopped
    pull_policy: if_not_present
    container_name: flink-jobmanager
    profiles: ["streaming", "all"]
    depends_on:
      flink-init-perms:
        condition: service_completed_successfully
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_JOB_PARALLELISM: 2
      ANOMALY_OPEN_THRESHOLD: 1000
      ANOMALY_CLOSE_THRESHOLD: 600
      ANOMALY_REALERT_SECONDS: 15
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cdia}
      CDIA_MIGRATIONS_DB_USER: ${CDIA_MIGRATIONS_DB_USER:-cdia_migrations}
      CDIA_MIGRATIONS_DB_PASSWORD: ${CDIA_MIGRATIONS_DB_PASSWORD:-change_me_migrations}
      POSTGRES_SLOT_NAME: ${POSTGRES_SLOT_NAME:-flink}
      POSTGRES_STARTUP_MODE: ${POSTGRES_STARTUP_MODE:-latest}
      ES_HOSTS: ${ES_HOSTS:-http://cdia-elasticsearch:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ELASTIC_PASSWORD:-test}
      ES_INDEX_EVENT_ANOMALIES: ${ES_INDEX_EVENT_ANOMALIES:-event-anomalies}
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:8081:8081"
      - "${CDIA_BIND_HOST:-127.0.0.1}:6123:6123"
    command: jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - ./processing-service/target/processing-service.jar:/opt/flink/usrlib/processing-service.jar:ro
      - flink-checkpoints:/flink-checkpoints
      - flink-savepoints:/flink-savepoints
      - ./flink/conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    expose:
      - "9249"
    networks:
      - cdia-net

  flink-taskmanager:
    image: flink:1.20.3-scala_2.12-java17
    restart: unless-stopped
    pull_policy: if_not_present
    container_name: flink-taskmanager
    profiles: ["streaming", "all"]
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-init-perms:
        condition: service_completed_successfully
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_JOB_PARALLELISM: 2
      ANOMALY_OPEN_THRESHOLD: 1000
      ANOMALY_CLOSE_THRESHOLD: 600
      ANOMALY_REALERT_SECONDS: 15
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cdia}
      CDIA_MIGRATIONS_DB_USER: ${CDIA_MIGRATIONS_DB_USER:-cdia_migrations}
      CDIA_MIGRATIONS_DB_PASSWORD: ${CDIA_MIGRATIONS_DB_PASSWORD:-change_me_migrations}
      POSTGRES_SLOT_NAME: ${POSTGRES_SLOT_NAME:-flink}
      POSTGRES_STARTUP_MODE: ${POSTGRES_STARTUP_MODE:-latest}
      ES_HOSTS: ${ES_HOSTS:-http://cdia-elasticsearch:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ELASTIC_PASSWORD:-test}
      ES_INDEX_EVENT_ANOMALIES: ${ES_INDEX_EVENT_ANOMALIES:-event-anomalies}
    command: taskmanager
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[T]askManagerRunner'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s  
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - flink-savepoints:/flink-savepoints
      - ./flink/conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    expose:
      - "9249"
    networks:
      - cdia-net

  nginx:
    container_name: cdia-nginx
    profiles: ["web", "all"]
    depends_on:
      search-service:
        condition: service_started
      ingestion-service:
        condition: service_started
      reports-service:
        condition: service_started
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_ENABLE_HEATMAP: ${VITE_ENABLE_HEATMAP:-true}
        VITE_FILTER_BY_BBOX: ${VITE_FILTER_BY_BBOX:-false}
    ports:
      - "${CDIA_BIND_HOST:-127.0.0.1}:80:80"
    networks:
      - cdia-net
