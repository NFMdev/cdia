server:
  port: 8080

spring:
  application:
    name: ingestion-service

  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cdia}
    username: ${CDIA_APP_DB_USER:cdia_app}
    password: ${CDIA_APP_DB_PASSWORD:change_me_app}
    driver-class-name: org.postgresql.Driver

  flyway:
    user: ${CDIA_MIGRATIONS_DB_USER:cdia_migrations}
    password: ${CDIA_MIGRATIONS_DB_PASSWORD:change_me_migrations}

  jpa:
    hibernate:
      ddl-auto: none   # schema is managed by Flyway (migrations role owns DDL)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
