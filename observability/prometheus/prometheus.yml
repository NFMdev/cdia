global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "ingestion-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingestion-service:8080"]

  - job_name: "event-simulator"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-simulator-service:8082"]

  - job_name: "cdia-flink"
    static_configs:
      - targets:
          - "flink-jobmanager:9249"
          - "flink-taskmanager:9249"

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cdia-cadvisor:8080"]
